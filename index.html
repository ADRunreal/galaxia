<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Explorador Galáctico · Vía Láctea</title>
<meta name="description" content="Viaja en 3D por el Sistema Solar, la Vía Láctea y el universo cercano. Explora planetas, lunas, estrellas, agujeros negros y galaxias." />
<meta name="theme-color" content="#03060d" />
<meta name="author" content="ADRunreal" />
<meta property="og:title" content="Explorador Galáctico · Vía Láctea" />
<meta property="og:description" content="Viaja en 3D por el Sistema Solar, la Vía Láctea y el universo cercano." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://adrunreal.github.io/galaxia/" />
<meta property="og:image" content="https://adrunreal.github.io/galaxia/preview.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Explorador Galáctico · Vía Láctea" />
<meta name="twitter:description" content="Viaja en 3D por el Sistema Solar, la Vía Láctea y el universo cercano." />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="apple-touch-icon" href="./favicon.svg" />
<style>
:root {
  color-scheme: dark;
  --bg: #03060d;
  --panel: rgba(8, 14, 28, 0.72);
  --panel-solid: rgba(10, 18, 34, 0.94);
  --border: rgba(110, 160, 240, 0.18);
  --border-hi: rgba(110, 160, 240, 0.55);
  --text: #d4e2ff;
  --text-dim: #7893c4;
  --text-bright: #f2f7ff;
  --accent: #5b8cff;
  --accent-glow: rgba(91, 140, 255, 0.45);
  --warn: #ff9c50;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg);
  font-family: var(--font); color: var(--text);
  -webkit-font-smoothing: antialiased;
  touch-action: none; user-select: none;
}
canvas { display: block; position: fixed; inset: 0; }

/* LOADER */
#loader {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: radial-gradient(ellipse at center, #0a1324 0%, #03060d 75%);
  transition: opacity 1s ease;
}
#loader.hide { opacity: 0; pointer-events: none; }
.loader-box { text-align: center; }
.loader-title {
  font-size: 11px; letter-spacing: 0.5em; text-transform: uppercase;
  color: #7a94c8; margin-bottom: 22px;
}
.loader-bar {
  width: 220px; height: 2px; background: rgba(110, 160, 240, 0.15);
  border-radius: 2px; overflow: hidden; margin: 0 auto 14px;
}
#loaderProgress {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #5b8cff, #8fb4ff);
  box-shadow: 0 0 12px var(--accent-glow);
  transition: width 0.35s ease;
}
.loader-status {
  font-size: 10px; letter-spacing: 0.2em;
  color: #4a6088; text-transform: uppercase;
}

/* PANEL CATÁLOGO */
#panel {
  position: fixed; top: 14px; left: 14px; z-index: 10;
  width: 270px; max-height: calc(100vh - 28px);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
#panel.collapsed { transform: translateX(-284px); }
.btn-toggle-panel {
  position: absolute; right: -28px; top: 14px;
  width: 28px; height: 40px;
  background: var(--panel);
  border: 1px solid var(--border); border-left: none;
  border-radius: 0 8px 8px 0;
  color: var(--text-bright); font-size: 14px; cursor: pointer;
  display: grid; place-items: center;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: background 0.15s;
  z-index: 11;
}
.btn-toggle-panel:hover { background: rgba(80, 130, 220, 0.6); border-color: var(--border-hi); }
#panel.collapsed .btn-toggle-panel { transform: rotate(180deg); }

#panel-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid rgba(110, 160, 240, 0.1);
}
#panel-head h1 {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-bright);
}
#panel-head .sub {
  font-size: 9.5px; color: var(--text-dim);
  letter-spacing: 0.08em; margin-top: 3px;
}
#search-wrap { padding: 10px 12px 4px; }
#search {
  width: 100%; padding: 7px 10px;
  background: rgba(20, 32, 58, 0.5);
  border: 1px solid rgba(110, 160, 240, 0.15);
  border-radius: 9px; color: var(--text);
  font-family: var(--font); font-size: 11px; outline: none;
  transition: border-color 0.2s, background 0.2s;
}
#search:focus { border-color: var(--border-hi); background: rgba(30, 45, 80, 0.6); }
#search::placeholder { color: #4a6088; }

#filterChips {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 6px 12px 8px;
  border-bottom: 1px solid rgba(110, 160, 240, 0.08);
}
.chip {
  font-size: 9px; padding: 3px 8px; border-radius: 20px;
  background: rgba(20, 32, 58, 0.5);
  border: 1px solid rgba(110, 160, 240, 0.15);
  color: #7893c4; cursor: pointer; font-family: var(--font);
  letter-spacing: 0.04em; text-transform: uppercase;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.chip:hover { background: rgba(80, 130, 220, 0.2); color: var(--text); }
.chip.active {
  background: rgba(80, 130, 220, 0.4); color: var(--text-bright);
  border-color: var(--border-hi);
}

#catalog {
  flex: 1; overflow-y: auto;
  padding: 6px 8px 10px;
  scrollbar-width: thin;
  scrollbar-color: rgba(110, 160, 240, 0.25) transparent;
}
#catalog::-webkit-scrollbar { width: 5px; }
#catalog::-webkit-scrollbar-thumb { background: rgba(110, 160, 240, 0.25); border-radius: 3px; }

.cat-group { margin-bottom: 6px; }
.cat-group.hidden { display: none; }
.cat-group h3 {
  font-size: 9px; font-weight: 600; letter-spacing: 0.18em;
  text-transform: uppercase; color: #4a6088;
  padding: 8px 8px 4px; pointer-events: none;
}
.cat-btn {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 6px 9px; margin-bottom: 2px;
  background: transparent; border: 1px solid transparent;
  border-radius: 8px; cursor: pointer; text-align: left;
  color: #b0c4e8; font-family: var(--font); font-size: 12px;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
}
.cat-btn:hover { background: rgba(80, 130, 220, 0.16); border-color: rgba(120, 160, 240, 0.25); }
.cat-btn:active { transform: scale(0.985); }
.cat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cat-btn.active {
  background: rgba(80, 130, 220, 0.32);
  border-color: var(--border-hi);
  color: var(--text-bright);
}
.cat-btn.hidden { display: none; }
.cat-btn .dot {
  width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}
.cat-btn .name { flex: 1; font-weight: 500; }
.cat-btn mark {
  background: rgba(255, 200, 80, 0.35); color: #ffe9b0;
  padding: 0 2px; border-radius: 2px;
}
.cat-btn .badge {
  font-size: 8.5px; padding: 2px 5px; border-radius: 4px;
  background: rgba(110, 160, 240, 0.12); color: #7893c4;
  letter-spacing: 0.04em;
}
#noResults {
  font-size: 11px; color: #4a6088; padding: 20px 10px;
  text-align: center; display: none;
}

/* SECCIÓN VISIBILIDAD */
#visibility {
  border-top: 1px solid rgba(110, 160, 240, 0.1);
  padding: 10px 12px;
  background: rgba(0, 0, 0, 0.15);
}
#visibility h3 {
  font-size: 9px; font-weight: 600; letter-spacing: 0.18em;
  text-transform: uppercase; color: #4a6088;
  padding-bottom: 6px;
}
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0; font-size: 11px; color: #b0c4e8; cursor: pointer;
}
.toggle-row:hover { color: var(--text-bright); }
.switch {
  position: relative; width: 28px; height: 16px;
  background: rgba(40, 60, 100, 0.6);
  border-radius: 8px; transition: background 0.2s;
  flex-shrink: 0;
}
.switch::after {
  content: ''; position: absolute;
  top: 2px; left: 2px; width: 12px; height: 12px;
  background: #7893c4; border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}
.toggle-row input { display: none; }
.toggle-row input:checked + .switch { background: rgba(91, 140, 255, 0.5); }
.toggle-row input:checked + .switch::after { transform: translateX(12px); background: #cfe0ff; }

/* INFO PANEL */
#info {
  position: fixed;
  top: 70px; right: 14px;
  z-index: 10;
  width: 300px; max-height: calc(100vh - 240px);
  background: var(--panel-solid);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  padding: 16px; overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  scrollbar-width: thin;
  scrollbar-color: rgba(110, 160, 240, 0.25) transparent;
  pointer-events: auto;
}
#info.hidden {
  opacity: 0; transform: translateY(-6px); pointer-events: none;
}
#info::-webkit-scrollbar { width: 5px; }
#info::-webkit-scrollbar-thumb { background: rgba(110, 160, 240, 0.25); border-radius: 3px; }

#infoName {
  font-size: 20px; font-weight: 600; color: var(--text-bright);
  letter-spacing: -0.01em; margin-bottom: 3px;
}
#infoType {
  font-size: 9.5px; color: var(--accent); letter-spacing: 0.14em;
  text-transform: uppercase; margin-bottom: 12px;
  display: inline-block; padding: 3px 8px;
  background: rgba(91, 140, 255, 0.12);
  border: 1px solid rgba(91, 140, 255, 0.22);
  border-radius: 5px;
}
#infoDesc {
  font-size: 12px; line-height: 1.6; color: #a8bce0;
  margin-bottom: 14px; padding-bottom: 14px;
  border-bottom: 1px solid rgba(110, 160, 240, 0.1);
}
.info-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
  margin-bottom: 14px;
}
.info-stat .label {
  font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: #4a6088; margin-bottom: 2px;
}
.info-stat .value {
  font-size: 11.5px; color: var(--text-bright); font-weight: 500;
  font-variant-numeric: tabular-nums;
}
#shareRow {
  display: flex; gap: 6px;
  padding-top: 12px;
  border-top: 1px solid rgba(110, 160, 240, 0.1);
}
#shareRow button {
  flex: 1; padding: 7px 10px;
  background: rgba(91, 140, 255, 0.15);
  border: 1px solid rgba(91, 140, 255, 0.28);
  border-radius: 8px; color: var(--text);
  font-family: var(--font); font-size: 10.5px;
  letter-spacing: 0.04em; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
#shareRow button:hover { background: rgba(91, 140, 255, 0.35); }
#shareRow button:active { transform: scale(0.97); }

/* HUD */
#scale {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; padding: 8px 18px;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: #8ba4d4;
  background: rgba(10, 18, 34, 0.55);
  border: 1px solid rgba(110, 160, 240, 0.14);
  border-radius: 20px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  white-space: nowrap;
  transition: opacity 0.4s ease;
}

#timeControl {
  position: fixed; top: 14px; right: 14px; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-dim);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
#timeControl input { width: 90px; accent-color: var(--accent); }
#timeValue { min-width: 32px; text-align: right; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
#btnPause {
  width: 26px; height: 26px; border-radius: 7px;
  background: rgba(80,130,220,0.22);
  border: 1px solid rgba(120,160,240,0.28);
  color: var(--text-bright); font-size: 12px; cursor: pointer;
  display: grid; place-items: center;
  transition: background .15s, transform .1s;
}
#btnPause:hover { background: rgba(80,130,220,0.45); }
#btnPause:active { transform: scale(0.92); }
#btnPause.paused { background: rgba(255,140,80,0.28); border-color: rgba(255,140,80,0.5); }

#zoomControls {
  position: fixed; bottom: 22px; right: 14px; z-index: 10;
  display: flex; flex-direction: column; gap: 6px;
}
#zoomControls button {
  width: 42px; height: 42px; border-radius: 11px;
  background: rgba(14, 22, 42, 0.72);
  border: 1px solid rgba(110, 160, 240, 0.2);
  color: var(--text); font-size: 16px; font-family: var(--font);
  cursor: pointer; display: grid; place-items: center;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: background 0.15s, transform 0.1s, border-color 0.15s;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
}
#zoomControls button:hover { background: rgba(50, 90, 180, 0.6); border-color: var(--border-hi); }
#zoomControls button:active { transform: scale(0.92); }
#zoomControls button.active { background: rgba(255,140,80,0.35); border-color: rgba(255,140,80,0.55); }

#hint {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 9; padding: 9px 20px;
  font-size: 10.5px; color: #8ba4d4; letter-spacing: 0.05em;
  background: rgba(10, 18, 34, 0.55);
  border: 1px solid rgba(110, 160, 240, 0.14);
  border-radius: 22px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  white-space: nowrap; pointer-events: none;
  transition: opacity 0.8s ease, transform .6s ease;
  margin-top: 50px;
}
#hint.fade { opacity: 0; transform: translateX(-50%) translateY(-6px); }

#tourBanner {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 20; padding: 9px 18px;
  font-size: 11px; letter-spacing: 0.08em;
  background: rgba(255, 140, 80, 0.15);
  border: 1px solid rgba(255, 140, 80, 0.5);
  border-radius: 22px;
  color: #ffd0a8;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none;
  align-items: center; gap: 12px;
}
#tourBanner.show { display: flex; }
#tourBanner button {
  background: transparent; border: 1px solid rgba(255, 140, 80, 0.4);
  color: #ffd0a8; font-family: var(--font); font-size: 10px;
  padding: 2px 8px; border-radius: 12px; cursor: pointer;
  letter-spacing: 0.04em;
}
#tourBanner button:hover { background: rgba(255, 140, 80, 0.2); }

/* TOASTS */
#toasts {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  z-index: 30; display: flex; flex-direction: column-reverse;
  align-items: center; gap: 6px; pointer-events: none;
}
.toast {
  padding: 8px 16px; font-size: 11.5px; letter-spacing: 0.04em;
  background: rgba(10, 18, 34, 0.92);
  border: 1px solid var(--border-hi);
  border-radius: 20px;
  color: var(--text-bright);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,0.55);
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ETIQUETAS 3D */
#labels {
  position: fixed; inset: 0; z-index: 5;
  pointer-events: none; overflow: hidden;
}
.body-label {
  position: absolute; left: 0; top: 0;
  font-size: 10px; letter-spacing: 0.08em;
  color: #cfe0ff; white-space: nowrap;
  padding: 2px 7px; border-radius: 10px;
  background: rgba(8,16,32,0.55);
  border: 1px solid rgba(110,160,240,0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: opacity .25s, color .15s, border-color .15s;
  will-change: transform, opacity;
  text-shadow: 0 1px 2px rgba(0,0,0,.8);
  pointer-events: none;
  user-select: none;
}
.body-label.active {
  color: #fff; border-color: var(--border-hi);
  background: rgba(40,70,140,0.7);
}
.body-label.hidden { opacity: 0; }

/* PHOTO MODE */
body.photo-mode #panel,
body.photo-mode #info,
body.photo-mode #scale,
body.photo-mode #timeControl,
body.photo-mode #zoomControls,
body.photo-mode #hint,
body.photo-mode #labels,
body.photo-mode #tourBanner { display: none !important; }
#photoHint {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 20; padding: 8px 16px;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: #ff9c50; background: rgba(10, 18, 34, 0.6);
  border: 1px solid rgba(255, 156, 80, 0.4);
  border-radius: 20px; display: none;
}
body.photo-mode #photoHint { display: block; }

/* RESPONSIVE */
@media (max-width: 720px) {
  #panel { width: 220px; }
  #panel.collapsed { transform: translateX(-234px); }
  #panel-head { padding: 10px 12px 8px; }
  #panel-head h1 { font-size: 10px; letter-spacing: 0.12em; }
  #search-wrap { padding: 8px 10px 2px; }
  .cat-btn { padding: 5px 7px; font-size: 11px; }
  .cat-btn .badge { display: none; }
  #info { width: calc(100vw - 16px); max-width: 320px; padding: 12px; top: 60px; right: 8px; max-height: 40vh; }
  #infoName { font-size: 15px; }
  #infoDesc { font-size: 10.5px; }
  .info-stats { grid-template-columns: 1fr; gap: 6px; }
  #scale { bottom: 130px; font-size: 8.5px; padding: 6px 12px; }
  #zoomControls { bottom: 130px; right: 10px; }
  #zoomControls button { width: 38px; height: 38px; font-size: 14px; }
  #timeControl { top: auto; bottom: 14px; right: 14px; padding: 6px 10px; }
  #timeControl input { width: 60px; }
  #hint { font-size: 9px; padding: 7px 14px; max-width: 84%; white-space: normal; text-align: center; top: 8px; margin-top: 0; }
  .body-label { font-size: 8.5px; padding: 1px 5px; }
  #btnPause { width: 24px; height: 24px; font-size: 11px; }
  #tourBanner { font-size: 10px; padding: 7px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-box">
    <div class="loader-title">Explorador Galáctico</div>
    <div class="loader-bar"><div id="loaderProgress"></div></div>
    <div class="loader-status" id="loaderStatus">Preparando el cosmos…</div>
  </div>
</div>

<aside id="panel" aria-label="Catálogo de cuerpos celestes">
  <button id="btnTogglePanel" class="btn-toggle-panel" title="Ocultar/Mostrar menú" aria-label="Ocultar o mostrar menú">◀</button>
  <div id="panel-head">
    <h1>Explorador Galáctico</h1>
    <div class="sub">Vía Láctea · Sistema Solar</div>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Buscar cuerpo celeste…" autocomplete="off" spellcheck="false" aria-label="Buscar cuerpo celeste" />
  </div>
  <div id="filterChips" role="toolbar" aria-label="Filtrar por categoría">
    <button class="chip active" data-cat="all">Todas</button>
    <button class="chip" data-cat="Planetas">Planetas</button>
    <button class="chip" data-cat="Lunas">Lunas</button>
    <button class="chip" data-cat="Enanos">Enanos</button>
    <button class="chip" data-cat="Estrellas">Estrellas</button>
    <button class="chip" data-cat="Galaxias">Galaxias</button>
  </div>
  <div id="catalog" role="list"></div>
  <div id="noResults">Sin resultados</div>
  <div id="visibility">
    <h3>Visualización</h3>
    <label class="toggle-row">Etiquetas
      <input type="checkbox" id="tglLabels" checked /><span class="switch"></span>
    </label>
    <label class="toggle-row">Órbitas
      <input type="checkbox" id="tglOrbits" checked /><span class="switch"></span>
    </label>
    <label class="toggle-row">Estrellas de fondo
      <input type="checkbox" id="tglBgStars" checked /><span class="switch"></span>
    </label>
    <label class="toggle-row">Nebulosas
      <input type="checkbox" id="tglNebulae" checked /><span class="switch"></span>
    </label>
    <label class="toggle-row">Bloom (brillo)
      <input type="checkbox" id="tglBloom" checked /><span class="switch"></span>
    </label>
  </div>
</aside>

<aside id="info" class="hidden" aria-live="polite">
  <div id="infoName"></div>
  <div id="infoType"></div>
  <div id="infoDesc"></div>

{

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ═══════════════ UTILIDADES ═══════════════ */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const gauss = () => {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
};
const smoothstep = (x, a, b) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function setLoader(pct, txt) {
  const p = document.getElementById('loaderProgress');
  const s = document.getElementById('loaderStatus');
  if (p) p.style.width = pct + '%';
  if (s && txt) s.textContent = txt;
}

/* ═══════════════ TEXTURAS PROCEDURALES ═══════════════ */
function makeGlowTexture(inner, mid, outer, size = 256) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.00, inner);
  g.addColorStop(0.18, mid);
  g.addColorStop(1.00, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeBandTexture(opts) {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = opts.base;
  ctx.fillRect(0, 0, W, H);
  const bands = opts.bands || 42;
  const palette = opts.palette;
  for (let i = 0; i < bands; i++) {
    const yBase = (i / bands) * H;
    const h = (H / bands) * (0.7 + Math.random() * 0.6);
    const shade = 0.55 + Math.random() * 0.7;
    const col = new THREE.Color(palette[i % palette.length]).multiplyScalar(shade);
    ctx.fillStyle = `rgb(${col.r*255|0},${col.g*255|0},${col.b*255|0})`;
    ctx.beginPath();
    ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 8) {
      const w = Math.sin(x * 0.012 + i * 1.7) * 6 + Math.sin(x * 0.034 + i * 3.1) * 2.5;
      ctx.lineTo(x, yBase + w);
    }
    for (let x = W; x >= 0; x -= 8) {
      const w = Math.sin(x * 0.012 + i * 1.7) * 6 + Math.sin(x * 0.034 + i * 3.1) * 2.5;
      ctx.lineTo(x, yBase + w + h);
    }
    ctx.closePath();
    ctx.fill();
  }
  for (let i = 0; i < 400; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const c = new THREE.Color(palette[i % palette.length]).multiplyScalar(0.4 + Math.random() * 0.7);
    ctx.fillStyle = `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${0.08 + Math.random() * 0.22})`;
    ctx.beginPath();
    ctx.ellipse(x, y, 15 + Math.random() * 50, 3 + Math.random() * 10, 0, 0, TAU);
    ctx.fill();
  }
  if (opts.greatSpot) {
    ctx.save();
    ctx.translate(W * 0.70, H * 0.63);
    ctx.rotate(-0.08);
    const grs = ctx.createRadialGradient(0, 0, 0, 0, 0, 95);
    grs.addColorStop(0.00, 'rgba(190, 50, 25, 0.95)');
    grs.addColorStop(0.45, 'rgba(165, 80, 50, 0.72)');
    grs.addColorStop(1.00, 'rgba(140, 100, 80, 0)');
    ctx.fillStyle = grs;
    ctx.beginPath();
    ctx.ellipse(0, 0, 95, 48, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function makeCraterTexture(baseColor, opts = {}) {
  const W = opts.size || 1024, H = W / 2;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const base = new THREE.Color(baseColor);
  ctx.fillStyle = '#' + base.getHexString();
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 300; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const r = 10 + Math.random() * 80;
    const c = base.clone().multiplyScalar(0.65 + Math.random() * 0.6);
    ctx.fillStyle = `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${0.12 + Math.random() * 0.25})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  const nCraters = opts.craters ?? 160;
  for (let i = 0; i < nCraters; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const r = 2 + Math.random() * 14;
    const dark = base.clone().multiplyScalar(0.35 + Math.random() * 0.25);
    const light = base.clone().multiplyScalar(1.1 + Math.random() * 0.2);
    ctx.fillStyle = `rgba(${light.r*255|0},${light.g*255|0},${light.b*255|0},0.35)`;
    ctx.beginPath();
    ctx.arc(x - r * 0.15, y - r * 0.15, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(${dark.r*255|0},${dark.g*255|0},${dark.b*255|0},0.55)`;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.82, 0, TAU);
    ctx.fill();
  }
  if (opts.polarCaps) {
    const capGrad = ctx.createLinearGradient(0, 0, 0, H * 0.12);
    capGrad.addColorStop(0, 'rgba(240, 240, 250, 0.92)');
    capGrad.addColorStop(1, 'rgba(240, 240, 250, 0)');
    ctx.fillStyle = capGrad;
    ctx.fillRect(0, 0, W, H * 0.12);
    const capGrad2 = ctx.createLinearGradient(0, H, 0, H * 0.9);
    capGrad2.addColorStop(0, 'rgba(240, 240, 250, 0.88)');
    capGrad2.addColorStop(1, 'rgba(240, 240, 250, 0)');
    ctx.fillStyle = capGrad2;
    ctx.fillRect(0, H * 0.9, W, H * 0.1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function makeSaturnRingTexture() {
  const W = 1024, H = 32;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  for (let x = 0; x < W; x++) {
    const t = x / W;
    let alpha = 0.55 + Math.sin(t * 24) * 0.15 + Math.random() * 0.12;
    if (t > 0.56 && t < 0.63) alpha *= 0.10;
    if (t > 0.85 && t < 0.875) alpha *= 0.35;
    if (t > 0.965) alpha *= (1 - t) / 0.035;
    if (t < 0.03) alpha *= t / 0.03;
    const shade = 0.65 + Math.random() * 0.35;
    ctx.fillStyle = `rgba(${218*shade|0},${186*shade|0},${132*shade|0},${alpha * 0.95})`;
    ctx.fillRect(x, 0, 1, H);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeSpiralGalaxyTexture() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grad.addColorStop(0.00, 'rgba(255, 240, 200, 0.95)');
  grad.addColorStop(0.10, 'rgba(220, 220, 255, 0.55)');
  grad.addColorStop(0.40, 'rgba(140, 160, 230, 0.18)');
  grad.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, S, S);
  for (let arm = 0; arm < 2; arm++) {
    const baseA = arm * Math.PI;
    for (let i = 0; i < 1500; i++) {
      const t = Math.pow(Math.random(), 0.6);
      const r = t * S * 0.45;
      const a = baseA + t * 4.2 + (Math.random() - 0.5) * 0.55;
      const x = S/2 + Math.cos(a) * r;
      const y = S/2 + Math.sin(a) * r;
      const size = 0.4 + Math.random() * 1.6;
      const bright = 1 - t * 0.5;
      ctx.fillStyle = `rgba(${170 + Math.random()*70|0}, ${180 + Math.random()*70|0}, 255, ${bright * (0.28 + Math.random() * 0.42)})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, TAU);
      ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeNebulaTexture(r, g, b) {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  for (let i = 0; i < 120; i++) {
    const x = S/2 + (Math.random() - 0.5) * S * 0.7;
    const y = S/2 + (Math.random() - 0.5) * S * 0.7;
    const rad = 30 + Math.random() * 120;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${r},${g},${b},${0.10 + Math.random() * 0.16})`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, TAU);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ═══════════════ RENDERER / ESCENA / CÁMARA ═══════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 50000);
camera.position.set(0, 1600, 2600);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.6;
controls.minDistance = 0.4;
controls.maxDistance = 20000;
controls.target.set(0, 0, 0);

// Postprocessing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.5, 0.85);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ═══════════════ FONDO ESTELAR + NEBULOSAS ═══════════════ */
let bgStarsMat = null;
let bgStarsObj = null;
(function buildStarfield() {
  const N = 8000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const phase = new Float32Array(N);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    const u = Math.random() * 2 - 1;
    const ph = Math.random() * TAU;
    const s = Math.sqrt(1 - u * u);
    const R = 8000 + Math.random() * 8000;
    pos[i3] = R * s * Math.cos(ph);
    pos[i3 + 1] = R * u;
    pos[i3 + 2] = R * s * Math.sin(ph);
    c.setHSL(0.55 + Math.random() * 0.15, 0.3 * Math.random(), 0.55 + Math.random() * 0.45);
    col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
    phase[i] = Math.random() * TAU;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float aPhase;
      varying vec3 vColor;
      varying float vTwinkle;
      uniform float uTime;
      void main() {
        vColor = color;
        vTwinkle = 0.7 + 0.3 * sin(uTime * 1.6 + aPhase);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = 1.9 * vTwinkle;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vTwinkle;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        if (dot(uv, uv) > 0.25) discard;
        gl_FragColor = vec4(vColor * vTwinkle, vTwinkle);
      }
    `,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  bgStarsMat = mat;
  bgStarsObj = pts;
})();

const nebulaeGroup = new THREE.Group();
scene.add(nebulaeGroup);
(function buildNebulae() {
  const cfgs = [
    { c: [180, 100, 210], s: 2400, p: [-3500, 800, -2200], o: 0.14 },
    { c: [100, 150, 255], s: 3000, p: [3200, -700, -1800], o: 0.11 },
    { c: [210, 120, 160], s: 2200, p: [-2400, -900, 3000], o: 0.13 },
    { c: [120, 180, 220], s: 2800, p: [3000, 900, 2400], o: 0.10 },
    { c: [200, 160, 240], s: 2000, p: [0, 2400, -3000], o: 0.09 }
  ];
  for (const n of cfgs) {
    const tex = makeGlowTexture(
      `rgba(${n.c[0]},${n.c[1]},${n.c[2]},1)`,
      `rgba(${n.c[0]},${n.c[1]},${n.c[2]},0.28)`,
      `rgba(${n.c[0]},${n.c[1]},${n.c[2]},0)`
    );
    const mat = new THREE.SpriteMaterial({
      map: tex, transparent: true, opacity: n.o,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const sp = new THREE.Sprite(mat);
    sp.position.set(...n.p);
    sp.scale.set(n.s, n.s, 1);
    nebulaeGroup.add(sp);
  }
})();

/* ═══════════════ GALAXIA PROCEDURAL (VÍA LÁCTEA) ═══════════════ */
const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

const GALAXY_CFG = {
  radius: 230,
  stars: 95000,
  arms: 2,
  tightness: 0.135,
  dust: 12000,
  haze: 5000
};

const galaxyMats = [];

const GAL_VERT = `
  uniform float uTime;
  uniform float uSize;
  uniform float uPixelRatio;
  attribute float aSize;
  attribute vec3 aColor;
  varying vec3 vColor;
  void main() {
    vec3 p = position;
    float r = length(p.xz);
    float omega = 0.12 * (1.0 + 0.25 * 60.0 / (60.0 + r));
    float a = atan(p.z, p.x) + uTime * omega;
    p.x = cos(a) * r;
    p.z = sin(a) * r;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    float dist = max(-mv.z, 0.1);
    gl_PointSize = aSize * uSize * uPixelRatio * (450.0 / dist);
    gl_PointSize = clamp(gl_PointSize, 0.5, 100.0);
    vColor = aColor;
  }
`;
const GAL_FRAG_STAR = `
  uniform float uAlpha;
  varying vec3 vColor;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    float d = sqrt(d2) * 2.0;
    float g = pow(1.0 - d, 2.2);
    vec3 col = vColor * (0.45 + 1.9 * g);
    gl_FragColor = vec4(col, g * uAlpha);
  }
`;
const GAL_FRAG_DUST = `
  uniform float uAlpha;
  varying vec3 vColor;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    float d = sqrt(d2) * 2.0;
    float a = pow(1.0 - d, 2.0);
    gl_FragColor = vec4(vColor, a * uAlpha);
  }
`;

function makeGalaxyCloud(geo, opts) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:       { value: 0 },
      uSize:       { value: opts.size ?? 1 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uAlpha:      { value: opts.alpha ?? 0.85 }
    },
    vertexShader: GAL_VERT,
    fragmentShader: opts.fragment ?? GAL_FRAG_STAR,
    transparent: true,
    depthWrite: false,
    blending: opts.blending ?? THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = opts.renderOrder ?? 1;
  galaxyGroup.add(pts);
  galaxyMats.push(mat);
  return mat;
}

(function buildGalaxyStars() {
  const N = GALAXY_CFG.stars;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const cBulgeA = new THREE.Color('#ffcf8a');
  const cBulgeB = new THREE.Color('#fff6e6');
  const cDisk   = new THREE.Color('#f7f3ff');
  const cArm    = new THREE.Color('#9cc2ff');
  const cO      = new THREE.Color('#6aa4ff');
  const cHII    = new THREE.Color('#ff5f9e');
  const c = new THREE.Color();
  const armStep = TAU / GALAXY_CFG.arms;
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    let x, y, z, size;
    if (Math.random() < 0.24) {
      const rr = GALAXY_CFG.radius * 0.30 * Math.pow(Math.random(), 0.62);
      const u = Math.random() * 2 - 1;
      const ph = Math.random() * TAU;
      const s = Math.sqrt(1 - u * u);
      x = rr * s * Math.cos(ph);
      z = rr * s * Math.sin(ph);
      y = rr * u * 0.55;
      size = 0.55 + Math.random() * 1.05;
      c.copy(cBulgeA).lerp(cBulgeB, Math.random() * 0.9);
    } else {
      let r = GALAXY_CFG.radius * Math.sqrt(Math.random());
      r = Math.max(r, 4) + gauss() * 2.2;
      if (r < 2) r = 2;
      const arm = Math.floor(Math.random() * GALAXY_CFG.arms);
      const base = arm * armStep + r * GALAXY_CFG.tightness;
      let ang;
      if (Math.random() < 0.30) ang = Math.random() * TAU;
      else ang = base + gauss() * (3.5 + Math.random() * 4.5) / Math.max(r, 14);
      x = Math.cos(ang) * r;
      z = Math.sin(ang) * r;
      y = gauss() * 4.0 * (1 - 0.45 * (r / GALAXY_CFG.radius));
      const f = r / GALAXY_CFG.radius;
      c.copy(cDisk).lerp(cArm, smoothstep(f, 0.08, 0.9));
      size = 0.5 + Math.random() * 1.0;
      const q = Math.random();
      if (q < 0.045) { c.copy(cO); size = 1.5 + Math.random() * 1.6; }
      else if (q < 0.054) { c.copy(cHII).lerp(cO, Math.random() * 0.35); size = 2.1 + Math.random() * 2.2; }
    }
    pos[i3] = x; pos[i3 + 1] = y; pos[i3 + 2] = z;
    col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
    siz[i] = size;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  makeGalaxyCloud(geo, { alpha: 0.8, renderOrder: 1 });
})();

(function buildGalaxyDust() {
  const N = GALAXY_CFG.dust;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const armStep = TAU / GALAXY_CFG.arms;
  const dustColor = new THREE.Color('#0a0704');
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    let r = GALAXY_CFG.radius * Math.sqrt(Math.random());
    r = Math.max(r, 15);
    const arm = Math.floor(Math.random() * GALAXY_CFG.arms);
    const base = arm * armStep + r * GALAXY_CFG.tightness;
    const ang = base - 0.07 + gauss() * (4.5 / Math.max(r, 18));
    const rr = r + gauss() * 4;
    pos[i3] = Math.cos(ang) * rr;
    pos[i3 + 1] = gauss() * 1.8;
    pos[i3 + 2] = Math.sin(ang) * rr;
    col[i3] = dustColor.r; col[i3 + 1] = dustColor.g; col[i3 + 2] = dustColor.b;
    siz[i] = 5 + Math.random() * 9;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));
  makeGalaxyCloud(geo, {
    alpha: 0.28, fragment: GAL_FRAG_DUST,
    blending: THREE.NormalBlending, renderOrder: 2
  });
})();

(function buildGalaxyHaze() {
  const N = GALAXY_CFG.haze;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  const armStep = TAU / GALAXY_CFG.arms;
  const cHaze = new THREE.Color('#6f9dff');
  const cHaze2 = new THREE.Color('#d9b8ff');
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    let r = GALAXY_CFG.radius * Math.sqrt(Math.random());
    r = Math.max(r, 8);
    const arm = Math.floor(Math.random() * GALAXY_CFG.arms);
    const base = arm * armStep + r * GALAXY_CFG.tightness;
    const ang = base + gauss() * (9.0 / Math.max(r, 20));
    pos[i3] = Math.cos(ang) * r;
    pos[i3 + 1] = gauss() * 2.8;
    pos[i3 + 2] = Math.sin(ang) * r;
    const cc = cHaze.clone().lerp(cHaze2, Math.random());
    col[i3] = cc.r; col[i3 + 1] = cc.g; col[i3 + 2] = cc.b;
    siz[i] = 10 + Math.random() * 20;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));

})();

let asteroidBelt = null;
(function buildAsteroidBelt() {
  const N = 1800;
  const geo = new THREE.DodecahedronGeometry(1, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x9a8a78, roughness: 1.0, metalness: 0,
    emissive: 0x221a12, emissiveIntensity: 0.3
  });
  const inst = new THREE.InstancedMesh(geo, mat, N);
  inst.instanceMatrix.setUsage(THREE.StaticDrawUsage);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const pos = new THREE.Vector3();
  const scl = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const r = 32 + Math.random() * 12 + gauss() * 1.5;
    const a = Math.random() * TAU;
    pos.set(Math.cos(a) * r, gauss() * 1.2, Math.sin(a) * r);
    e.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
    q.setFromEuler(e);
    const s = 0.05 + Math.random() * 0.18;
    scl.set(s, s * (0.7 + Math.random() * 0.6), s);
    m.compose(pos, q, scl);
    inst.setMatrixAt(i, m);
  }
  inst.instanceMatrix.needsUpdate = true;
  asteroidBelt = inst;
  scene.add(inst);
})();

let kuiperBelt = null;
(function buildKuiperBelt() {
  const N = 3000;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    const r = 118 + Math.random() * 70 + gauss() * 2;
    const a = Math.random() * TAU;
    pos[i3] = Math.cos(a) * r;
    pos[i3 + 1] = gauss() * 3;
    pos[i3 + 2] = Math.sin(a) * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x7a90c4, size: 0.35, transparent: true, opacity: 0.4,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  kuiperBelt = new THREE.Points(geo, mat);
  kuiperBelt.frustumCulled = false;
  scene.add(kuiperBelt);
})();

/* ═══════════════ SHADERS ESPECIALES ═══════════════ */
const SUN_FRAG = `
  uniform float time;
  uniform vec3 uColor;
  varying vec3 vPos;
  float hash(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float noise(vec3 x) {
    vec3 i = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                   mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                   mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  void main() {
    vec3 p = vPos * 0.32;
    float n = noise(p + vec3(0.0, time * 0.18, 0.0)) * 0.5
            + noise(p * 2.4 + vec3(time * 0.35, 0.0, 0.0)) * 0.25
            + noise(p * 5.8 + vec3(0.0, time * 0.55, 0.0)) * 0.125;
    vec3 cool = vec3(1.0, 0.35, 0.02);
    vec3 mid  = vec3(1.0, 0.68, 0.18);
    vec3 hot  = vec3(1.0, 0.97, 0.78);
    vec3 col = mix(cool, mid, smoothstep(0.15, 0.55, n));
    col = mix(col, hot, smoothstep(0.55, 0.85, n));
    vec3 finalCol = col * uColor;
    gl_FragColor = vec4(finalCol * 1.35, 1.0);
  }
`;
const SUN_VERT = `
  varying vec3 vPos;
  void main() {
    vPos = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const EARTH_VERT = `
  varying vec2 vUv;
  varying vec3 vNormalW;
  void main() {
    vUv = uv;
    vNormalW = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const EARTH_FRAG = `
  uniform sampler2D dayMap;
  uniform vec3 sunDir;
  varying vec2 vUv;
  varying vec3 vNormalW;
  void main() {
    vec3 n = normalize(vNormalW);
    float ndl = dot(n, sunDir);
    float day = smoothstep(-0.12, 0.28, ndl);
    vec3 dayCol = texture2D(dayMap, vUv).rgb;
    float landMask = smoothstep(0.0, 0.30, dayCol.g - dayCol.b);
    vec3 nightCol = dayCol * 0.035;
    nightCol += vec3(1.0, 0.72, 0.32) * landMask * 0.18;
    vec3 litCol = dayCol * (0.08 + 0.92 * max(ndl, 0.0));
    vec3 col = mix(nightCol, litCol, day);
    float terminator = 1.0 - abs(day * 2.0 - 1.0);
    col += vec3(0.15, 0.35, 0.7) * terminator * 0.12;
    gl_FragColor = vec4(col, 1.0);
  }
`;
const CLOUD_FRAG = `
  uniform sampler2D cloudMap;
  uniform vec3 sunDir;
  varying vec2 vUv;
  varying vec3 vNormalW;
  void main() {
    float a = texture2D(cloudMap, vUv).r;
    float ndl = dot(normalize(vNormalW), sunDir);
    float day = smoothstep(-0.15, 0.25, ndl);
    vec3 col = vec3(1.0) * (0.06 + 0.94 * day);
    gl_FragColor = vec4(col, a * 0.78);
  }
`;
const ATMO_FRAG = `
  uniform vec3 sunDir;
  varying vec3 vNormalW;
  varying vec3 vPosW;
  void main() {
    vec3 viewDir = normalize(cameraPosition - vPosW);
    float rim = 1.0 - abs(dot(viewDir, normalize(vNormalW)));
    rim = pow(rim, 3.2);
    float sun = max(dot(normalize(vNormalW), sunDir), 0.0);
    float lit = smoothstep(-0.15, 0.45, sun);
    vec3 col = vec3(0.32, 0.58, 1.0) * rim * (0.35 + 0.65 * lit);
    gl_FragColor = vec4(col, rim * lit * 0.9);
  }
`;
const ATMO_VERT = `
  varying vec3 vNormalW;
  varying vec3 vPosW;
  void main() {
    vNormalW = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vPosW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;
const BH_DISK_FRAG = `
  uniform float time;
  uniform vec3 uColor;
  varying vec2 vUv;
  void main() {
    float r = length(vUv - 0.5) * 2.0;
    float angle = atan(vUv.y - 0.5, vUv.x - 0.5);
    float spin = time * 1.6 + angle * 2.5 + r * 4.0;
    float noise = 0.55 + 0.45 * sin(spin) * sin(spin * 1.7 + r * 8.0);
    float ring = smoothstep(0.35, 0.55, r) * (1.0 - smoothstep(0.82, 1.0, r));
    vec3 hot = vec3(1.0, 0.95, 0.7);
    vec3 col = mix(uColor, hot, pow(noise, 2.5)) * (0.7 + 0.9 * noise);
    float a = ring * noise * 0.9;
    gl_FragColor = vec4(col, a);
  }
`;
const BH_DISK_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const bodies = {};
const clickTargets = [];
const earthUniforms = [];
const orbitLines = [];
const cometTails = [];
const blackHoles = [];

const minHitRadius = 0.28;

class CelestialBody {
  constructor(data) {
    this.data = data;
    this.orbitAngle = Math.random() * TAU;

    this.orbitGroup = new THREE.Group();
    this.holder = new THREE.Group();
    this.tiltGroup = new THREE.Group();
    this.satelliteGroup = new THREE.Group();

    this.holder.position.x = data.orbitRadius || 0;
    this.tiltGroup.rotation.z = data.axialTilt || 0;

    this.orbitGroup.add(this.holder);
    this.holder.add(this.tiltGroup);
    this.holder.add(this.satelliteGroup);

    const segs = data.radius > 1 ? 64 : (data.radius > 0.3 ? 48 : 24);
    const geo = new THREE.SphereGeometry(data.radius, segs, Math.max(12, Math.floor(segs / 2)));
    const mat = this._createMaterial();
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.userData.bodyId = data.id;
    this.tiltGroup.add(this.mesh);
    clickTargets.push(this.mesh);

    if (data.radius < minHitRadius) {
      const hb = new THREE.Mesh(
        new THREE.SphereGeometry(minHitRadius, 8, 6),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
      );
      hb.userData.bodyId = data.id;
      this.tiltGroup.add(hb);
      clickTargets.push(hb);
    }

    if (data.isEarth) this._addEarthEffects();
    if (data.isSaturn) this._addSaturnRings();
    if (data.id === 'sun' || data.category === 'Estrellas') this._addSunCorona();
    if (data.isComet) this._addCometTail();
    if (data.isBlackHole) this._addBlackHoleEffect();
    if (data.isNebula) this._addNebulaEffect();
    if (data.isGalaxy) this._addGalaxyEffect();
    if (data.isArtificial) this._addArtificialMarker();

    this._lastWorldPos = new THREE.Vector3();
    this.mesh.getWorldPosition(this._lastWorldPos);

    bodies[data.id] = this;
  }

  _createMaterial() {
    const d = this.data;
    if (d.id === 'sun' || d.category === 'Estrellas') {
      return new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 }, uColor: { value: new THREE.Color(d.color) } },
        vertexShader: SUN_VERT,
        fragmentShader: SUN_FRAG
      });
    }
    if (d.isEarth) {
      const m = new THREE.ShaderMaterial({
        uniforms: { dayMap: { value: earthTex }, sunDir: { value: new THREE.Vector3(1, 0, 0) } },
        vertexShader: EARTH_VERT, fragmentShader: EARTH_FRAG
      });
      earthUniforms.push(m.uniforms);
      return m;
    }
    if (d.isMoon) {
      return new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1.0, metalness: 0 });
    }
    if (d.isBlackHole) {
      return new THREE.MeshBasicMaterial({ color: 0x000000 });
    }
    if (d.isNebula) {
      return new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.05 });
    }
    if (d.isGalaxy) {
      return new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
    }
    if (d.isArtificial) {
      return new THREE.MeshBasicMaterial({ color: d.color });
    }
    if (TEX[d.id]) {
      return new THREE.MeshStandardMaterial({ map: TEX[d.id], roughness: 0.92, metalness: 0.02 });
    }
    return new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.95, metalness: 0 });
  }

  _addEarthEffects() {
    const cloudGeo = new THREE.SphereGeometry(this.data.radius * 1.008, 64, 48);
    const cloudMat = new THREE.ShaderMaterial({
      uniforms: { cloudMap: { value: earthCloud }, sunDir: { value: new THREE.Vector3(1, 0, 0) } },
      vertexShader: EARTH_VERT, fragmentShader: CLOUD_FRAG,
      transparent: true, depthWrite: false
    });
    this.clouds = new THREE.Mesh(cloudGeo, cloudMat);
    this.tiltGroup.add(this.clouds);
    earthUniforms.push(cloudMat.uniforms);

    const atmoGeo = new THREE.SphereGeometry(this.data.radius * 1.04, 64, 48);
    const atmoMat = new THREE.ShaderMaterial({
      uniforms: { sunDir: { value: new THREE.Vector3(1, 0, 0) } },
      vertexShader: ATMO_VERT, fragmentShader: ATMO_FRAG,
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, side: THREE.BackSide
    });
    this.atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
    this.tiltGroup.add(this.atmosphere);
    earthUniforms.push(atmoMat.uniforms);
  }

  _addSaturnRings() {
    const inner = this.data.radius * 1.35;
    const outer = this.data.radius * 2.4;
    const geo = new THREE.RingGeometry(inner, outer, 128, 1);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const r = v.length();
      uv.setXY(i, (r - inner) / (outer - inner), 0.5);
    }
    const mat = new THREE.MeshStandardMaterial({
      map: saturnRingTex, side: THREE.DoubleSide,
      transparent: true, opacity: 0.85, roughness: 1.0, metalness: 0,
      depthWrite: false
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = Math.PI / 2;
    this.tiltGroup.add(ring);
    this.ring = ring;
  }

  _addSunCorona() {
    const tex = makeGlowTexture('rgba(255,255,255,1)', 'rgba(200,200,255,0.5)', 'rgba(0,0,0,0)');
    this.coronaA = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: this.data.color, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
    }));
    this.coronaA.scale.set(this.data.radius * 6, this.data.radius * 6, 1);
    this.tiltGroup.add(this.coronaA);
  }

  _addCometTail() {
    const geo = new THREE.ConeGeometry(0.1, 1, 8, 1, true);
    geo.rotateX(Math.PI / 2);
    geo.translate(0, 0, 0.5);
    const mat = new THREE.MeshBasicMaterial({
      color: this.data.color, transparent: true, opacity: 0.35,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    this.tail = new THREE.Mesh(geo, mat);
    this.tail.userData.cometId = this.data.id;
    scene.add(this.tail);
    const c = this.data.color;
    const tex = makeGlowTexture(
      'rgba(255,255,255,1)',
      `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},0.6)`,
      `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},0)`
    );
    this.coma = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: this.data.color, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    this.coma.scale.setScalar(this.data.radius * 5);
    this.tiltGroup.add(this.coma);
    cometTails.push(this);
  }

  _addBlackHoleEffect() {
    const r = this.data.radius;
    const diskGeo = new THREE.RingGeometry(r * 1.4, r * 3.5, 96, 1);
    const diskMat = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 }, uColor: { value: new THREE.Color(this.data.color) } },
      vertexShader: BH_DISK_VERT, fragmentShader: BH_DISK_FRAG,
      transparent: true, side: THREE.DoubleSide, depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    this.disk = new THREE.Mesh(diskGeo, diskMat);
    this.disk.rotation.x = Math.PI / 2.3;
    this.tiltGroup.add(this.disk);

    const photonGeo = new THREE.RingGeometry(r * 1.05, r * 1.12, 64);
    const photonMat = new THREE.MeshBasicMaterial({
      color: this.data.color, transparent: true, opacity: 0.85,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.photonRing = new THREE.Mesh(photonGeo, photonMat);
    this.photonRing.rotation.x = Math.PI / 2.3;
    this.tiltGroup.add(this.photonRing);

    blackHoles.push(this);
  }

  _addNebulaEffect() {
    const [r, g, b] = this.data.nebulaColor || [255, 130, 200];
    const tex = makeNebulaTexture(r, g, b);
    const sprMat = new THREE.SpriteMaterial({
      map: tex, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const spr = new THREE.Sprite(sprMat);
    spr.scale.setScalar(this.data.radius * 3.0);
    this.tiltGroup.add(spr);

    const glowTex = makeGlowTexture(
      `rgba(${r},${g},${b},1)`,
      `rgba(${r},${g},${b},0.35)`,
      `rgba(${r},${g},${b},0)`
    );
    const glowMat = new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: 0.4,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.setScalar(this.data.radius * 5.5);
    this.tiltGroup.add(glow);

    this.mesh.visible = false;
    this.nebulaSprites = [spr, glow];
  }

  _addGalaxyEffect() {
    const tex = makeSpiralGalaxyTexture();
    const sprMat = new THREE.SpriteMaterial({
      map: tex, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
    });
    const spr = new THREE.Sprite(sprMat);
    spr.scale.setScalar(this.data.radius * 4.0);
    this.tiltGroup.add(spr);
    this.mesh.visible = false;
    this.galaxySprite = spr;
  }

  _addArtificialMarker() {
    const tex = makeGlowTexture(
      'rgba(255,255,255,1)',
      'rgba(255,220,150,0.5)',
      'rgba(255,200,100,0)'
    );
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: this.data.color, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    spr.scale.setScalar(0.35);
    this.tiltGroup.add(spr);
    this.marker = spr;
  }

  update(dt, elapsed, speedFactor) {
    const d = this.data;
    if (d.orbitSpeed && d.parent !== null) {
      this.orbitAngle += d.orbitSpeed * dt * 0.4 * speedFactor;
    } else if (d.orbitSpeed) {
      this.orbitAngle += d.orbitSpeed * dt * 0.05 * speedFactor;
    }
    if (d.parent === null && d.orbitRadius) {
      const x = Math.cos(this.orbitAngle) * d.orbitRadius;
      const z = Math.sin(this.orbitAngle) * d.orbitRadius;
      this.orbitGroup.position.set(x, 0, z);
    } else {
      this.orbitGroup.position.set(0, 0, 0);
    }
    if (d.rotSpeed) {
      this.mesh.rotation.y += d.rotSpeed * dt * speedFactor;
      if (this.clouds) this.clouds.rotation.y += d.rotSpeed * dt * speedFactor * 1.15;
    }
    this.mesh.getWorldPosition(this._lastWorldPos);
  }

  updateShader(t) {
    if (this.data.id === 'sun' || this.data.category === 'Estrellas') {
      if (this.mesh.material.uniforms) this.mesh.material.uniforms.time.value = t;
      if (this.coronaA) {
        const s = this.data.radius * (6 + Math.sin(t * 1.3) * 0.25);
        this.coronaA.scale.set(s, s, 1);
      }
    }
    if (this.disk) this.disk.material.uniforms.time.value = t;
    if (this.photonRing) {
      this.photonRing.material.opacity = 0.6 + 0.3 * Math.sin(t * 3.0);
    }
    if (this.nebulaSprites) {
      const [spr, glow] = this.nebulaSprites;
      spr.material.opacity = 0.4 + 0.18 * Math.sin(t * 0.6);
      glow.material.opacity = 0.3 + 0.12 * Math.sin(t * 0.9 + 1.0);
    }
    if (this.galaxySprite) {
      this.galaxySprite.material.rotation = t * 0.03;
    }
    if (this.marker) {
      this.marker.material.opacity = 0.6 + 0.35 * Math.sin(t * 4.0);
    }
  }
}

/* ═══════════════ LÍNEAS DE ÓRBITA ═══════════════ */
(function buildOrbits() {
  for (const data of BODIES_DATA) {
    if (!data.orbitRadius || data.parent === null) continue;
    const radius = data.orbitRadius;
    const segments = 128;
    const positions = new Float32Array((segments + 1) * 3);
    for (let i = 0; i <= segments; i++) {
      const a = (i / segments) * TAU;
      positions[i * 3] = Math.cos(a) * radius;
      positions[i * 3 + 1] = 0;
      positions[i * 3 + 2] = Math.sin(a) * radius;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const isMoon = data.category === 'Lunas';
    const mat = new THREE.LineBasicMaterial({
      color: isMoon ? 0x445577 : 0x335588,
      transparent: true, opacity: isMoon ? 0.22 : 0.18,
      depthWrite: false
    });
    const line = new THREE.LineLoop(geo, mat);
    line.userData.bodyId = data.id;
    orbitLines.push(line);
    const parentBody = data.parent ? bodies[data.parent] : null;
    if (parentBody) {
      parentBody.satelliteGroup.add(line);
    } else {
      solarSystem.add(line);
    }
  }
})();

function applyFilters() {
  const q = currentSearch;
  let anyVisible = false;
  document.querySelectorAll('.cat-group').forEach(group => {
    const cat = group.dataset.cat;
    const catMatch = currentFilter === 'all' || currentFilter === cat;
    let groupVisible = false;
    group.querySelectorAll('.cat-btn').forEach(btn => {
      const name = btn.dataset.name;
      const matchName = !q || name.includes(q);
      const visible = catMatch && matchName;
      btn.classList.toggle('hidden', !visible);
      if (visible) groupVisible = true;
      if (q && matchName && name.includes(q)) {
        const original = BODIES_DATA.find(b => b.id === btn.dataset.id).name;
        const idx = norm(original).indexOf(q);
        if (idx >= 0) {
          const before = original.slice(0, idx);
          const hit = original.slice(idx, idx + q.length);
          const after = original.slice(idx + q.length);
          btn.querySelector('.name').innerHTML = `${before}<mark>${hit}</mark>${after}`;
        }
      } else {
        const original = BODIES_DATA.find(b => b.id === btn.dataset.id).name;
        btn.querySelector('.name').textContent = original;
      }
    });
    group.classList.toggle('hidden', !groupVisible);

  });

const _projVec = new THREE.Vector3();
function updateLabels() {
  if (!labelsVisible) {
    for (const id in labelMap) labelMap[id].classList.add('hidden');
    return;
  }
  const w = window.innerWidth, h = window.innerHeight;
  for (const data of BODIES_DATA) {
    const body = bodies[data.id];
    if (!body) continue;
    const el = labelMap[data.id];
    if (!el) continue;
    const pos = body._lastWorldPos;
    _projVec.copy(pos).project(camera);
    if (_projVec.z > 1 || _projVec.z < -1) {
      el.classList.add('hidden');
      continue;
    }
    const x = (_projVec.x * 0.5 + 0.5) * w;
    const y = (-_projVec.y * 0.5 + 0.5) * h;
    if (x < -100 || x > w + 100 || y < -50 || y > h + 50) {
      el.classList.add('hidden');
      continue;
    }
    const dist = camera.position.distanceTo(pos);
    if (dist > 3000) {
      el.classList.add('hidden');
      continue;
    }
    el.classList.remove('hidden');
    el.style.transform = `translate(${x + 10}px, ${y - 10}px) translate(-50%, -50%)`;
    el.classList.toggle('active', selectedId === data.id);
  }
}

/* ═══════════════ CÁMARA: VIAJE A CUERPO ═══════════════ */
let camTween = null;
function focusBody(id, showPanel = true) {
  const body = bodies[id];
  if (!body) return;
  const data = body.data;
  const target = body._lastWorldPos.clone();
  const dist = data.isGalaxy || data.isNebula
    ? data.radius * 5
    : Math.max(data.radius * 6, 1.2);
  const offset = new THREE.Vector3(dist * 0.6, dist * 0.35, dist * 0.8);
  const camEnd = target.clone().add(offset);
  const camStart = camera.position.clone();
  const targetStart = controls.target.clone();
  camTween = {
    t: 0, dur: 1.4,
    camStart, camEnd, targetStart, targetEnd: target
  };
  if (showPanel) showInfo(data);
}

function updateCamTween(dt) {
  if (!camTween) return;
  camTween.t += dt / camTween.dur;
  const t = easeInOutCubic(Math.min(camTween.t, 1));
  camera.position.lerpVectors(camTween.camStart, camTween.camEnd, t);
  controls.target.lerpVectors(camTween.targetStart, camTween.targetEnd, t);
  if (camTween.t >= 1) camTween = null;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = { x: 0, y: 0 };
let pointerDown = false;

renderer.domElement.addEventListener('pointerdown', e => {
  downPos.x = e.clientX;
  downPos.y = e.clientY;
  pointerDown = true;
});

renderer.domElement.addEventListener('pointerup', e => {
  if (!pointerDown) return;
  pointerDown = false;
  const dx = e.clientX - downPos.x;
  const dy = e.clientY - downPos.y;
  if (Math.hypot(dx, dy) > 6) return;
  if (tourActive) return;

  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  if (hits.length > 0) {
    const id = hits[0].object.userData.bodyId;
    if (id) focusBody(id, true);
  }
});

/* ═══════════════ TOUR GUIADO ═══════════════ */
const TOUR_IDS = ['sun', 'mercury', 'venus', 'earth', 'moon', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'andromeda', 'sgra', 'orion'];
let tourActive = false;
let tourIndex = 0;
let tourTimer = null;
const tourBanner = document.getElementById('tourBanner');
const tourText = document.getElementById('tourText');

function startTour() {
  if (tourActive) return;
  tourActive = true;
  tourIndex = 0;
  tourBanner.classList.add('show');
  nextTourStep();
}
function nextTourStep() {
  if (!tourActive) return;
  if (tourIndex >= TOUR_IDS.length) {
    stopTour();
    return;
  }
  const id = TOUR_IDS[tourIndex];
  const data = BODIES_DATA.find(b => b.id === id);
  if (data) {
    tourText.textContent = `Tour · ${data.name} (${tourIndex + 1}/${TOUR_IDS.length})`;
    focusBody(id, true);
  }
  tourIndex++;
  tourTimer = setTimeout(nextTourStep, 4200);
}
function stopTour() {
  tourActive = false;
  tourBanner.classList.remove('show');
  if (tourTimer) { clearTimeout(tourTimer); tourTimer = null; }
}

function updateSunDirection() {

  if (!sun) return;

}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = clock.getElapsedTime();
  const speed = paused ? 0 : timeScale;

  // Actualizar cuerpos
  for (const id in bodies) {
    const b = bodies[id];
    b.update(dt, elapsed, speed);
  }

  // Galaxia procedural
  for (const m of galaxyMats) {
    m.uniforms.uTime.value = elapsed * (paused ? 0 : 0.4);
  }

  // Fondo estelar
  if (bgStarsMat) bgStarsMat.uniforms.uTime.value = elapsed;

  // Dirección del Sol (para la Tierra)
  updateSunDirection();

  // Shaders especiales
  for (const id in bodies) {
    bodies[id].updateShader(elapsed);
  }

  // Colas de cometas (orientadas al Sol)
  for (const comet of cometTails) {
    const worldPos = comet._lastWorldPos;
    const dir = worldPos.clone().normalize();
    const tail = comet.tail;
    tail.position.copy(worldPos).add(dir.clone().multiplyScalar(comet.data.radius * 2));
    tail.lookAt(worldPos.clone().add(dir));
    const len = 4 + comet.data.radius * 20;
    tail.scale.set(1, 1, len);
  }

  // Cámara tween
  updateCamTween(dt);

  // Controls
  controls.update();

  // Etiquetas
  updateLabels();

  // Composer
  composer.render();
}

/* ═══════════════ ARRANQUE ═══════════════ */
setLoader(75, 'Preparando la cámara…');
setTimeout(() => {
  setLoader(90, 'Alineando las estrellas…');
}, 300);
setTimeout(() => {
  if (!texDone) { texDone = true; maybeHideLoader(); }
}, 4000);

animate();
</script>
